<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title }} | {{ site.title }}</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gradient-to-br from-slate-950 via-slate-900 to-slate-800 text-white">
  <!-- Header -->
  <header class="sticky top-0 z-20 border-b border-slate-700/50 bg-slate-950/80 backdrop-blur-sm py-4 px-4 shadow-2xl shadow-slate-950/20">
    <div class="max-w-6xl mx-auto flex flex-col gap-4 md:flex-row md:items-center md:justify-between">
      <div>
        <h1 class="text-xl font-semibold tracking-wide">{{ site.title }}</h1>
        <p class="text-sm text-slate-400 mt-1">Минималистичное темное портфолио</p>
      </div>
      <nav>
        <ul class="flex flex-wrap justify-center gap-5 text-sm font-medium text-slate-300">
          <li><a href="/" class="transition hover:text-cyan-300">Главная</a></li>
          <li><a href="/about" class="transition hover:text-cyan-300">Обо мне</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <!-- Main Content -->
  <main class="px-4 py-8">
    {{ content }}
  </main>

  <!-- Footer -->
  <footer class="border-t border-slate-700/50 bg-slate-950/80 py-8 px-4 text-slate-400">
    <div class="max-w-6xl mx-auto text-center">
      <p class="text-sm">&copy; {{ site.time | date: "%Y" }} {{ site.title }}. Все права защищены.</p>
      <div class="mt-3">
        <a href="https://github.com/{{ site.github_username }}" target="_blank" class="text-sm text-cyan-300 hover:text-white transition">GitHub</a>
      </div>
    </div>
  </footer>
</body>
</html>
